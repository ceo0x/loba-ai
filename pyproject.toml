[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loba-ai"
version = "0.1.0"
description = "Training engine for La Loba card game AI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Loba AI" }]
dependencies = [
  "numpy>=1.26",
  "gymnasium>=0.29",
  "torch>=2.2",
  "stable-baselines3>=2.3",
  "sb3-contrib>=2.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "websockets>=12.0",
  "pytest>=8.0",
  "tqdm>=4.66",
  "rich>=13.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["loba_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
