<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loba Remote</title>
  <link rel="stylesheet" href="/web/styles.css" />
</head>
<body>
  <main class="layout">
    <header class="topbar">
      <div>
        <h1>Loba Remote</h1>
        <p>Adaptador cliente WebSocket para jugar contra el protocolo remoto.</p>
      </div>
      <span id="remoteHealthBadge" class="badge">API: ...</span>
    </header>

    <section class="panel">
      <h2>Crear sesión remota</h2>
      <div class="row">
        <input id="remoteMockHost" placeholder="127.0.0.1" />
        <input id="remoteMockPort" placeholder="8766" />
        <input id="remoteMockName" placeholder="brother-bot" />
        <input id="remoteMockSeed" placeholder="seed (random)" />
        <button id="remoteMockSeedRandomBtn" class="secondary">Random Seed</button>
        <button id="remoteMockStartBtn" class="secondary">Start Mock</button>
        <button id="remoteMockStopBtn" class="secondary">Stop Mock</button>
        <button id="remoteMockStatusBtn" class="secondary">Mock Status</button>
      </div>
      <p id="remoteMockMeta" class="muted"></p>
      <div class="row">
        <input id="remoteWsUrl" placeholder="ws://192.168.1.50:8765/" />
        <input id="remoteBotName" placeholder="brother-bot" />
        <input id="remoteToken" placeholder="token opcional" />
      </div>
      <div class="row">
        <input id="remoteModelName" placeholder="modelo local registrado" />
        <input id="remoteActionDelay" type="number" min="0" max="30" step="0.1" placeholder="delay s" title="Segundos a esperar antes de cada acción del modelo (0 = sin delay)" style="width: 110px;" />
        <label class="check-control" for="remoteLikePolicyChk">
          <input id="remoteLikePolicyChk" type="checkbox" />
          <span>Remote-like policy</span>
        </label>
        <label class="check-control" for="remoteSpectatorChk" title="Mostrar manos de los oponentes (solo funciona contra el mock server)">
          <input id="remoteSpectatorChk" type="checkbox" />
          <span>Spectator</span>
        </label>
        <button id="remoteCreateBtn">Crear sesión</button>
        <button id="remoteStartBtn" class="secondary">Start</button>
        <button id="remoteStopBtn" class="secondary">Stop</button>
        <button id="remoteRestartBtn" class="secondary" title="Nueva partida con la misma configuración (auto-resetea el mock)">Nueva partida</button>
        <button id="remoteRefreshBtn" class="secondary">Refrescar</button>
      </div>
      <p id="remoteSessionMeta" class="muted"></p>
    </section>

    <section id="remoteSpectatorPanel" class="panel" style="display: none;">
      <h2>Vista Spectator</h2>
      <p class="muted">Manos de todos los jugadores (solo funciona contra el mock server local).</p>
      <div id="remoteSpectatorContent"></div>
    </section>

    <section class="panel game-state table-panel">
      <h2 class="table-panel-title">Mesa remota</h2>
      <div class="table-felt">
        <div id="remoteStateSummary" class="felt-summary"></div>

        <div class="felt-center">
          <div class="felt-pile felt-pile--stock">
            <span class="felt-pile__label">Mazo</span>
            <div id="remoteStockVisual" class="cards-row"></div>
            <span id="remoteStockCount" class="felt-pile__count">0</span>
          </div>

          <div class="felt-pile felt-pile--discard">
            <span class="felt-pile__label">Descarte</span>
            <div id="remoteDiscardTop" class="cards-row"></div>
          </div>
        </div>

        <div id="remotePlayersSummary" class="felt-players"></div>

        <div class="felt-melds-wrap">
          <h3 class="felt-melds-title">Melds en mesa</h3>
          <div id="remoteMelds" class="melds felt-melds"></div>
        </div>

        <div>
          <h3 class="felt-melds-title">Tu mano</h3>
          <div id="remoteOwnHand" class="cards-row human-large"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>Eventos</h2>
      <div id="remoteLog" class="log"></div>
    </section>
  </main>

  <script src="/web/remote.js"></script>
</body>
</html>
